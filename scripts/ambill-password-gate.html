<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>AM 发票工具 · 访问验证</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231B4F8F'/%3E%3Cpath d='M20 14h18l8 8v28H20z' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#17212f;background:#f2f5f9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#e3edf9,transparent 65%)}
main{width:min(100%,410px);padding:36px 32px 28px;background:#fff;border:1px solid #dfe5ec;border-radius:18px;box-shadow:0 12px 40px #1b4f8f0a}
.brand{font-size:14px;font-weight:800;letter-spacing:2px;color:#1b4f8f;margin:0 0 26px}
.lock{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#e8f0fa;color:#1b4f8f;margin-bottom:18px}
h1{margin:0 0 9px;font-size:25px;line-height:1.4}
.intro{margin:0 0 26px;color:#5d6878;font-size:14px;line-height:1.7}
label{display:block;margin-bottom:9px;font-size:14px;font-weight:600}
input{width:100%;height:52px;padding:10px 16px;font:18px system-ui,sans-serif;letter-spacing:1px;border:1px solid #c7d2e0;border-radius:9px;color:#17212f;background:#fff;outline:none}
input:focus{border-color:#1b4f8f;box-shadow:0 0 0 3px #1b4f8f16}
input[aria-invalid="true"]{border-color:#bd3737}
.hint{font-size:12px;color:#778293;margin:8px 0 0}
.message{min-height:24px;line-height:1.6;margin:10px 0;font-size:13px;color:#b33131}
button{width:100%;min-height:48px;border:0;border-radius:9px;background:#1b4f8f;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#16427a}button:focus-visible{outline:3px solid #8bb1df;outline-offset:3px}button:disabled{opacity:.7;cursor:wait}
.footer{margin:24px 0 0;padding-top:20px;border-top:1px solid #edf1f5;color:#8490a0;font-size:12px;text-align:center}
noscript{display:block;color:#b33131;font-size:14px;line-height:1.7}
@media(max-width:480px){main{padding:28px 24px}body{padding:18px}}
</style>
</head>
<body>
<main>
  <p class="brand">COTEX · AMBILL</p>
  <div class="lock" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></div>
  <h1>AM 发票工具</h1>
  <p class="intro">请输入共用密码，使用AM 发票工具。</p>
  <form id="unlock-form" method="post">
    <label for="access-password">访问密码</label>
    <input id="access-password" name="password" type="password" autocomplete="off" spellcheck="false" required disabled aria-describedby="password-hint unlock-message">
    <p id="password-hint" class="hint">请向管理员获取访问密码</p>
    <p id="unlock-message" class="message" role="status" aria-live="polite"></p>
    <button type="submit" id="unlock-button" disabled>进入工具</button>
  </form>
  <noscript>请启用浏览器的 JavaScript 后输入访问密码。</noscript>
  <p class="footer">CoTeX China · AM 发票工具</p>
</main>
<script id="sealed-tool" type="application/json">__ENCRYPTED_TOOL__</script>
<script>
(() => {
  const form = document.getElementById('unlock-form');
  const input = document.getElementById('access-password');
  const button = document.getElementById('unlock-button');
  const message = document.getElementById('unlock-message');
  const payload = JSON.parse(document.getElementById('sealed-tool').textContent);
  const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
  let busy = false;
  input.addEventListener('input', () => {
    input.removeAttribute('aria-invalid');
    message.textContent = '';
  });
  if (!window.isSecureContext || !window.crypto?.subtle) {
    message.textContent = '请使用支持安全连接的现代浏览器，通过 HTTPS 打开此页面。';
    button.disabled = true;
    return;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy || !form.reportValidity()) return;
    busy = true;
    button.disabled = true;
    button.textContent = '正在验证…';
    message.textContent = '';
    const password = new TextEncoder().encode(input.value);
    input.value = '';
    let plaintext;
    try {
      const material = await crypto.subtle.importKey('raw', password, 'PBKDF2', false, ['deriveKey']);
      password.fill(0);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
        material, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
      );
      plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: bytes(payload.iv), tagLength: 128 }, key, bytes(payload.ciphertext),
      );
    } catch (error) {
      password.fill(0);
      message.textContent = error.name === 'OperationError' ? '密码不正确，请重试。' : '暂时无法打开，请刷新页面后重试。';
      input.setAttribute('aria-invalid', 'true');
      busy = false;
      button.disabled = false;
      button.textContent = '进入工具';
      input.focus();
      return;
    }
    // Keep the current URL/hash. Nothing is stored in cookies or browser storage.
    const html = new TextDecoder().decode(plaintext);
    new Uint8Array(plaintext).fill(0);
    document.open();
    document.write(html);
    document.close();
  });
  input.disabled = false;
  button.disabled = false;
})();
</script>
</body>
</html>
