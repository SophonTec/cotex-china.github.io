:root{color-scheme:light;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#17212f;background:#f2f5f9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#e3edf9,transparent 65%)}

.lock{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#e8f0fa;color:#1b4f8f;margin-bottom:18px}
h1{margin:0 0 9px;font-size:25px;line-height:1.4}

label{display:block;margin-bottom:9px;font-size:14px;font-weight:600}
input{width:100%;height:52px;padding:10px 16px;font:18px system-ui,sans-serif;letter-spacing:1px;border:1px solid #c7d2e0;border-radius:9px;color:#17212f;background:#fff;outline:none}
input:focus{border-color:#1b4f8f;box-shadow:0 0 0 3px #1b4f8f16}

.hint{font-size:12px;color:#778293;margin:8px 0 0}
.message{min-height:24px;line-height:1.6;margin:10px 0;font-size:13px;color:#b33131}

button:hover{background:#16427a}button:focus-visible{outline:3px solid #8bb1df;outline-offset:3px}button:disabled{opacity:.7;cursor:wait}
.footer{margin:24px 0 0;padding-top:20px;border-top:1px solid #edf1f5;color:#8490a0;font-size:12px;text-align:center}

<script>
(() => {
  const form = document.getElementById('unlock-form');
  const input = document.getElementById('access-password');
  const button = document.getElementById('unlock-button');
  const message = document.getElementById('unlock-message');
  const payload = JSON.parse(document.getElementById('sealed-tool').textContent);
  const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
  let busy = false;
  input.addEventListener('input', () => {
    input.removeAttribute('aria-invalid');
    message.textContent = '';
  });
  if (!window.isSecureContext || !window.crypto?.subtle) {
    message.textContent = '请使用支持安全连接的现代浏览器，通过 HTTPS 打开此页面。';
    button.disabled = true;
    return;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy || !form.reportValidity()) return;
    busy = true;
    button.disabled = true;
    button.textContent = '正在验证…';
    message.textContent = '';
    let sharedPassword = input.value;
    const password = new TextEncoder().encode(sharedPassword);
    input.value = '';
    let plaintext;
    try {
      const material = await crypto.subtle.importKey('raw', password, 'PBKDF2', false, ['deriveKey']);
      password.fill(0);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
        material, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
      );
      plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: bytes(payload.iv), tagLength: 128 }, key, bytes(payload.ciphertext),
      );
    } catch (error) {
      password.fill(0);
      sharedPassword = null;
      message.textContent = error.name === 'OperationError' ? '密码不正确，请重试。' : '暂时无法打开，请刷新页面后重试。';
      input.setAttribute('aria-invalid', 'true');
      busy = false;
      button.disabled = false;
      button.textContent = '进入工具';
      input.focus();
      return;
    }
    try {
      button.textContent = '正在连接归档服务…';
      const response = await fetch('https://erp.cotex-china.com/tools-admin-api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tool: 'pi-tool', password: sharedPassword }),
        signal: AbortSignal.timeout(20000),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === 'string' ? result.detail : '归档服务暂不可用');
      window.__cotexArchiveSession = result;
    } catch (error) {
      new Uint8Array(plaintext).fill(0);
      message.textContent = '归档服务连接失败，请稍后重试。' + (error.message || '');
      busy = false; button.disabled = false; button.textContent = '进入工具'; input.focus();
      return;
    } finally { sharedPassword = null; }
    // Keep URL/hash. The scoped archive credential lives only in page memory.
    const html = new TextDecoder().decode(plaintext);
    new Uint8Array(plaintext).fill(0);
    document.open();
    document.write(html);
    document.close();
  });
  input.disabled = false;
  button.disabled = false;
})();
</script>
