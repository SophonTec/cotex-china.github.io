*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#e3edf9,transparent 65%)}

<script>
(() => {
  const form = document.getElementById('unlock-form');
  const input = document.getElementById('access-password');
  const button = document.getElementById('unlock-button');
  const message = document.getElementById('unlock-message');
  const payload = JSON.parse(document.getElementById('sealed-tool').textContent);
  const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
  let busy = false;
  input.addEventListener('input', () => {
    input.removeAttribute('aria-invalid');
    message.textContent = '';
  });
  if (!window.isSecureContext || !window.crypto?.subtle) {
    message.textContent = '请使用支持安全连接的现代浏览器，通过 HTTPS 打开此页面。';
    button.disabled = true;
    return;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy || !form.reportValidity()) return;
    busy = true;
    button.disabled = true;
    button.textContent = '正在验证…';
    message.textContent = '';
    let sharedPassword = input.value;
    const password = new TextEncoder().encode(sharedPassword);
    input.value = '';
    let plaintext;
    try {
      const material = await crypto.subtle.importKey('raw', password, 'PBKDF2', false, ['deriveKey']);
      password.fill(0);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
        material, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
      );
      plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: bytes(payload.iv), tagLength: 128 }, key, bytes(payload.ciphertext),
      );
    } catch (error) {
      password.fill(0);
      sharedPassword = null;
      message.textContent = error.name === 'OperationError' ? '密码不正确，请重试。' : '暂时无法打开，请刷新页面后重试。';
      input.setAttribute('aria-invalid', 'true');
      busy = false;
      button.disabled = false;
      button.textContent = '进入工具';
      input.focus();
      return;
    }
    try {
      button.textContent = '正在连接归档服务…';
      const response = await fetch('https://erp.cotex-china.com/tools-admin-api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tool: 'pi-tool', password: sharedPassword }),
        signal: AbortSignal.timeout(20000),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === 'string' ? result.detail : '归档服务暂不可用');
      window.__cotexArchiveSession = result;
    } catch (error) {
      new Uint8Array(plaintext).fill(0);
      message.textContent = '归档服务连接失败，请稍后重试。' + (error.message || '');
      busy = false; button.disabled = false; button.textContent = '进入工具'; input.focus();
      return;
    } finally { sharedPassword = null; }
    // Keep URL/hash. The scoped archive credential lives only in page memory.
    const html = new TextDecoder().decode(plaintext);
    new Uint8Array(plaintext).fill(0);
    document.open();
    document.write(html);
    document.close();
  });
  input.disabled = false;
  button.disabled = false;
  const launch = new URLSearchParams(location.hash.slice(1)).get('launch');
  if (launch) {
    // A single-use ticket travels in the fragment, never in server logs or referrers.
    history.replaceState(null, '', location.pathname + location.search);
    busy = true; input.disabled = true; button.disabled = true;
    button.textContent = '正在打开工具…';
    message.textContent = '正在从管理中心进入…';
    (async () => {
      try {
        const fingerprint = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes(payload.ciphertext)))].map(n => n.toString(16).padStart(2, '0')).join('');
        const response = await fetch('https://erp.cotex-china.com/tools-admin-api/auth/launch', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tool: 'pi-tool', ticket: launch, fingerprint }),
          signal: AbortSignal.timeout(20000),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(typeof result.detail === 'string' ? result.detail : '快捷登录暂不可用');
        const rawKey = bytes(result.key); delete result.key;
        const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
        rawKey.fill(0);
        const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv), tagLength: 128 }, key, bytes(payload.ciphertext));
        const html = new TextDecoder().decode(plaintext); new Uint8Array(plaintext).fill(0);
        window.__cotexArchiveSession = result;
        document.open(); document.write(html); document.close();
      } catch (error) {
        message.textContent = '快捷登录未完成：' + (error.message || '连接失败') + '。请从管理页重新打开，或输入工具密码。';
        busy = false; input.disabled = false; button.disabled = false; button.textContent = '进入工具';
      }
    })();
  }
})();
</script>
